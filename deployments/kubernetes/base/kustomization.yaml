apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: agent-monitor-base

labels:
  - pairs:
      app.kubernetes.io/name: agent-monitor
      app.kubernetes.io/instance: agent-monitor
      app.kubernetes.io/version: "4.2.0"
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  - name: cam-dashboard
    newTag: 4.2.0
